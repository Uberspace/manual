[build]
  publish = "build/dirhtml"
  command = "make dirhtml"

[[redirects]]
  # Temporary: this domain will serve the Uberspace 8 manual later.
  from = "https://manual.uberspace.de/*"
  to = "https://u7manual.uberspace.de/:splat"
  status = 302
  force = true

[[redirects]]
  from = "http://manual.uberspace.de/*"
  to = "https://u7manual.uberspace.de/:splat"
  status = 302
  force = true

[[redirects]]
  # Redirect old wiki domain
  from = "https://wiki.uberspace.de/*"
  to = "https://u7manual.uberspace.de/"
  status = 301
  force = true

[[redirects]]
  # Redirect domain aliases to primary domain
  from = "https://manual-72.uberspace.de/*"
  to = "https://u7manual.uberspace.de/:splat"
  status = 301
  force = true

[[redirects]]
  # Redirect default Netlify subdomain to primary domain
  from = "https://manual-uberspace-de.netlify.com/*"
  to = "https://u7manual.uberspace.de/:splat"
  status = 301
  force = true

[[redirects]]
  # Remove `/en` language prefix from path
  from = "/en/*"
  to = "/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/web-security.html"
  to = "/web-security-headers.html"
  force = true

[[redirects]]
  from = "/web-security"
  to = "/web-security-headers"
  force = true

# disabled because of problems with .html forwards
